<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IYAD OTAKOU</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif; 
    direction: ltr;
    min-height: 100vh;
  }
  #brand { 
    text-align: center; 
    padding: 10px 12px; 
    background: rgba(14, 17, 22, 0.85);
    border-bottom: 1px solid #1e2732; 
  }
  #brand img { 
    width: 32px; 
    height: 32px; 
    margin-right: 8px; 
    border-radius: 50%;
    vertical-align: middle; 
    object-fit: cover;
  }
  #brand b { 
    font-size: 16px; 
    font-weight: 700; 
    letter-spacing: .12em;
    color: #e6ebf2; 
    vertical-align: middle; 
  }
  #spin { 
    margin: 40px auto 10px; 
    width: 36px; 
    height: 36px; 
    border: 3px solid rgba(255,255,255,0.1); 
    border-left-color: #7fd0a0; 
    border-radius: 50%; 
    animation: spin 1s linear infinite; 
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  #msg { text-align: center; font-size: 16px; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>
<div id="brand">
  <img src="logo.png" alt="IYAD OTAKOU Logo" width="32" height="32">
  <b>IYAD OTAKOU</b>
</div>
<div id="spin"></div>
<div id="msg">Restart your console</div>

<script src="ps4_offsets.js"></script>
<script src="int64.js"></script>
<script src="mem.js"></script>
<script src="core.js"></script>
<script src="jb.js"></script>
</body>
</html>
